# Nginx site for church-cafe. ONE domain fronts both processes:
#
#   /api/       /uploads/   /socket.io/   /health   ->  Express  127.0.0.1:4000
#   everything else                                 ->  Next.js  127.0.0.1:3100
#
# Same-origin is not a preference here, it is a requirement: in production
# src/app/_lib/socket.ts calls io() with no URL, so the browser opens the
# Socket.IO connection against the page's own origin. Splitting the API onto a
# second hostname would break realtime until that file is changed.
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/church-cafe
#           sudo ln -sfn /etc/nginx/sites-available/church-cafe \
#                        /etc/nginx/sites-enabled/church-cafe
#           sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d example.com -d www.example.com`. Certbot
# rewrites this file in place: it adds the listen 443 / ssl_certificate lines
# and the http -> https redirect, and sets up automatic renewal. Don't hand-write
# the TLS block; let certbot own it.
#
# This file does not touch the furniture-shop site on the same box. Its upstream
# and map names are prefixed so the two configs can never collide inside the
# shared http {} context.

upstream church_cafe_frontend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream church_cafe_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# WebSocket upgrade plumbing for Socket.IO. Prefixed rather than the usual
# $connection_upgrade because a duplicate map name anywhere else in
# sites-enabled would make `nginx -t` fail for every site on the server.
map $http_upgrade $church_cafe_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # CHANGE ME - must match the -d flags passed to certbot.
    server_name example.com www.example.com;

    # Must stay above the backend's UPLOAD_MAX_IMAGE_MB (default 15), or nginx
    # rejects product/avatar uploads with a 413 before Express ever sees them.
    client_max_body_size 20m;

    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/rss+xml;

    # --- Realtime -----------------------------------------------------------
    # Socket.IO. Long-lived and upgraded, so it gets its own timeouts and must
    # not be buffered. No `Connection ""` here - that would kill the upgrade.
    location /socket.io/ {
        proxy_pass http://church_cafe_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $church_cafe_conn_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # Well past Socket.IO's 25s ping interval, so an idle board on a wall
        # display is never cut off mid-shift.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # --- Express API --------------------------------------------------------
    location /api/ {
        proxy_pass http://church_cafe_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Product and user images written by multer into the backend's shared
    # uploads/ directory and served by express.static.
    location /uploads/ {
        proxy_pass http://church_cafe_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Filenames carry a timestamp (product-<id>-<timestamp>.ext) and a
        # replacement image gets a new name, so these are safe to cache hard in
        # the browser. `expires` emits the Cache-Control header itself - don't
        # add a second one. No proxy_cache here: that would need a
        # proxy_cache_path at http level and buys little for a handful of
        # images already coming off local disk.
        expires 7d;
    }

    # Backend liveness, handy from outside for uptime monitoring.
    location = /health {
        proxy_pass http://church_cafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host       $host;
        access_log off;
    }

    # --- Next.js ------------------------------------------------------------
    location / {
        proxy_pass http://church_cafe_frontend;
        proxy_http_version 1.1;

        # Empty Connection header keeps the upstream keepalive pool alive.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Next streams RSC payloads and Suspense boundaries; buffering them
        # delays first paint.
        proxy_buffering off;
    }
}
